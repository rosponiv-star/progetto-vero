<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo App - Progetto HCI</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Leaflet (CSS e JS per la Mappa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .suggerimenti-container { position: relative; }
        #lista-suggerimenti { 
            position: absolute; top: 100%; left: 0; right: 0; 
            z-index: 1050; display: none; max-height: 250px; overflow-y: auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .suggerimento-item { cursor: pointer; transition: background 0.2s; }
        .suggerimento-item:hover { background-color: #f8f9fa; }
        
        /* Nasconde la scrollbar nei tab dei giorni mantenendo lo scorrimento */
        #pulsanti-giorni::-webkit-scrollbar { display: none; }
        #pulsanti-giorni { -ms-overflow-style: none; scrollbar-width: none; }

        /* Rimuove lo sfondo base dei marker di Leaflet per il nostro badge custom */
        .marker-trasparente { background: transparent; border: none; }
        .tick-marks span { font-size: 0.75rem; color: #adb5bd; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        
        <!-- BARRA DI RICERCA E GEOLOCALIZZAZIONE -->
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-3 suggerimenti-container">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">🔍</span>
                            <input type="text" id="input-ricerca" class="form-control border-start-0" placeholder="Cerca una città..." autocomplete="off">
                            <button class="btn btn-outline-primary" id="btn-geoloc" title="Usa la mia posizione">📍</button>
                        </div>
                        <ul id="lista-suggerimenti" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- MESSAGGI DI STATO -->
        <div class="row justify-content-center mb-3">
            <div class="col-12 col-lg-10">
                <div id="stato" class="alert alert-info text-center shadow-sm" role="alert">
                    Cerca una città o usa il tasto 📍 per visualizzare il meteo.
                </div>
            </div>
        </div>

        <!-- STRUTTURA PRINCIPALE APP -->
        <div id="app-meteo" style="display: none;">
            
            <h2 id="luogo-titolo" class="h3 text-center mb-4 text-primary fw-bold">📍 Città</h2>
            
            <!-- MAPPA E TIMELINE -->
            <div class="row justify-content-center mb-4">
                <div class="col-12 col-lg-10">
                    <div class="card shadow border-0 bg-dark text-white">
                        <div class="card-body p-2">
                            
                            <!-- Mappa con Dark Theme e Label di avviso -->
                            <div class="position-relative">
                                <span class="badge bg-danger position-absolute top-0 start-0 m-2 shadow" style="z-index: 1000;">
                                    📡 Radar Nuvole: TEMPO REALE
                                </span>
                                <div id="mappa-meteo" style="height: 380px; width: 100%; border-radius: 8px; z-index: 1;"></div>
                            </div>
                            
                            <!-- Timeline Interattiva -->
                            <div class="mt-3 px-3 pb-2" id="timeline-container" style="display: none;">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="small fw-bold text-light">Previsione <span class="text-warning">sul marker</span> per le ore:</span>
                                    <span id="label-orario-timeline" class="badge bg-primary fs-5 shadow-sm">--:--</span>
                                </div>
                                <input type="range" class="form-range" id="slider-timeline" min="0" step="1" value="0">
                                <div class="d-flex justify-content-between tick-marks mt-1 px-1" id="tick-marks-timeline">
                                    <!-- Generati da JS -->
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- TABS DEI GIORNI -->
            <div class="row justify-content-center mb-4">
                <div class="col-12 col-lg-10">
                    <ul id="pulsanti-giorni" class="nav nav-pills justify-content-center flex-nowrap overflow-auto pb-2" style="white-space: nowrap;"></ul>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">
                    <!-- OVERVIEW DEL GIORNO -->
                    <div id="sezione-overview" class="mb-4"></div>
                    
                    <!-- PULSANTE ESPANSIONE DETTAGLI -->
                    <div class="text-center mb-4">
                        <button id="btn-toggle-ore" class="btn btn-outline-primary rounded-pill px-4 shadow-sm">
                            🔽 Mostra dettaglio testuale per fasce orarie
                        </button>
                    </div>

                    <!-- GRIGLIA DETTAGLI ORARI -->
                    <div id="dettaglio-ore" class="row g-3" style="display: none;"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Il nostro Script -->
    <script src="app.js"></script>
</body>
</html>
